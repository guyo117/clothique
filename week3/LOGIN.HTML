<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothique | Login</title>
    <style>
        body { margin: 0; font-family: sans-serif; background-color: #111; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .form-container { background-color: #1e1e1e; padding: 40px; border-radius: 8px; border-top: 5px solid #d32f2f; width: 100%; max-width: 400px; }
        h2 { text-align: center; margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 14px; }
        .input-group input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #333; background-color: #2a2a2a; color: #fff; border-radius: 4px; }
        .btn { width: 100%; background-color: #d32f2f; color: #fff; padding: 12px; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        .btn:hover { background-color: #b71c1c; }
        .link { text-align: center; margin-top: 20px; font-size: 14px; }
        .link a { color: #d32f2f; text-decoration: none; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Welcome Back</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="john@example.com">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
        <div class="link">Don't have an account? <a href="signup.html">Sign up</a></div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            window.location.href = 'dashboard.html';
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
