<!DOCTYPE html>
<html lang="en">
<head>

        .hero p { font-size: 18px; color: #555; margin-bottom: 30px; }
        .btn { background-color: #d32f2f; color: #fff; padding: 12px 25px; text-decoration: none; font-weight: bold; border-radius: 4px; border: none; cursor: pointer; }
